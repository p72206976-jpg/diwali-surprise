
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Diwali Surprise</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow-x:hidden;
 display:flex;align-items:center;justify-content:center;
 text-align:center;color:#fff1cf;
 font-family:Georgia,serif;
 background:radial-gradient(circle at top,#702b71,#29103e 55%,#09051b);
}
.card{
 width:92%;max-width:480px;padding:32px 20px;
 border:2px solid #e8bd64;border-radius:25px;
 background:#271039df;
 box-shadow:0 0 45px #ffc04a55;
}
h1{font-size:35px;color:#ffdb83;text-shadow:0 0 15px #ffad35}
.hindi{font-size:28px;color:#ffe3a4}
.lamps{font-size:48px;animation:glow 1.5s infinite alternate}
@keyframes glow{to{filter:drop-shadow(0 0 18px gold);transform:scale(1.08)}}
button{
 padding:17px 28px;border:0;border-radius:40px;
 background:linear-gradient(100deg,#fff0ac,#e9a12d);
 color:#34133c;font-weight:bold;font-size:19px;
 box-shadow:0 0 25px #ffc14d;cursor:pointer;
}
#surprise{display:none;animation:appear 2s ease}
@keyframes appear{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
#wishes{font-size:19px;line-height:1.8}
#sky{position:fixed;inset:0;pointer-events:none;z-index:5}
.star{position:fixed;animation:fall 4s linear infinite;pointer-events:none}
@keyframes fall{from{transform:translateY(-10vh) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<main class="card">
 <div class="lamps">🪔 ✨ 🪔</div>
 <h1>A Special Diwali Surprise!</h1>
 <div class="hindi">शुभ दीपावली</div>
 <p>Someone has a beautiful surprise for you!</p>
 <button onclick="celebrate()">🪔 TAP HERE 🪔</button>
 <div id="surprise">
  <h1>🎆 HAPPY DIWALI! 🎆</h1>
  <div class="lamps">🪔 🌸 🪔</div>
  <div id="wishes">
   May your life shine brighter than a thousand lights!<br><br>
   आपका जीवन खुशियों और समृद्धि से जगमगाए!<br><br>
   Wishing you love, laughter and prosperity! ❤️
  </div>
  <h1>✨ शुभ दीपावली ✨</h1>
  <div style="font-size:35px">🎇 🎆 🎇</div>
 </div>
</main>
<script>
const canvas=document.getElementById("sky");
const ctx=canvas.getContext("2d");
let fireworks=[];
function resize(){
 canvas.width=innerWidth;
 canvas.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);

function burst(x,y){
 for(let i=0;i<65;i++){
  let a=Math.random()*Math.PI*2;
  let speed=Math.random()*4+1;
  fireworks.push({
   x,y,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,
   life:65,color:`hsl(${Math.random()*360},100%,65%)`
  });
 }
}
function animate(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 fireworks.forEach((p)=>{
  ctx.fillStyle=p.color;
  ctx.globalAlpha=p.life/65;
  ctx.beginPath();
  ctx.arc(p.x,p.y,3,0,Math.PI*2);
  ctx.fill();
  p.x+=p.vx;p.y+=p.vy;
  p.vy+=0.025;p.life--;
 });
 ctx.globalAlpha=1;
 fireworks=fireworks.filter(p=>p.life>0);
 requestAnimationFrame(animate);
}
animate();

let party=false;
function celebrate(){
 document.getElementById("surprise").style.display="block";
 if(party)return;
 party=true;
 for(let i=0;i<20;i++){
  setTimeout(()=>{
   burst(Math.random()*canvas.width,
         Math.random()*canvas.height*.65);
  },i*350);
 }
 for(let i=0;i<35;i++){
  let s=document.createElement("div");
  s.className="star";
  s.textContent=["✨","🌸","⭐","🪔"][i%4];
  s.style.left=Math.random()*100+"%";
  s.style.animationDelay=Math.random()*3+"s";
  document.body.appendChild(s);
 }
}
</script>
</body>
</html>
