
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali Fireworks Surprise 🪔</title>

<style>
* { box-sizing:border-box; }

body {
 margin:0;
 min-height:100vh;
 background:radial-gradient(circle at top,#64245d,#1a0b2c 65%,#080513);
 color:#ffe7ad;
 font-family:Georgia,serif;
 text-align:center;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 overflow-x:hidden;
}

.card {
 width:100%;
 max-width:480px;
 padding:30px 18px;
 border:2px solid #e8bb65;
 border-radius:25px;
 background:#29113bee;
 box-shadow:0 0 35px #ffbd5055;
 position:relative;
 z-index:2;
}

h1 { color:#ffdb82;font-size:30px; }
.hindi { font-size:28px;color:#ffe5ad; }

button {
 border:0;
 border-radius:40px;
 padding:17px 27px;
 background:linear-gradient(100deg,#fff0ac,#e7a02a);
 color:#35113a;
 font-size:19px;
 font-weight:bold;
 cursor:pointer;
 box-shadow:0 0 25px #ffbd50;
 margin:20px 0;
}

#videoBox { display:none;margin-top:20px; }

video {
 width:100%;
 border:3px solid #e9bd65;
 border-radius:17px;
 box-shadow:0 0 25px #ffbf55;
}

#fireworks {
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
 z-index:5;
}

.small { font-size:13px; }
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="card">
 <div style="font-size:55px">🪔✨🪔</div>

 <h1>A Special Diwali Surprise!</h1>

 <div class="hindi">शुभ दीपावली</div>

 <p>
   Someone has prepared a magical surprise for you!<br>
   आपके लिए एक खास दिवाली सरप्राइज़!
 </p>

 <button id="start" onclick="startSurprise()">
   🪔 TAP HERE 🪔
 </button>

 <div id="videoBox">
   <h2>🎆 HAPPY DIWALI! 🎆</h2>

   <video id="myVideo" controls playsinline preload="metadata">
     <source src="diwali.mp4" type="video/mp4">
     Your browser cannot play this video.
   </video>

   <p class="small">
     Wishing you happiness, prosperity and love! ❤️
   </p>
 </div>
</div>

<script>
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let audioContext;

function resize() {
 canvas.width = innerWidth * devicePixelRatio;
 canvas.height = innerHeight * devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
resize();
window.addEventListener("resize",resize);

function burst(x,y) {
 const colors=["#ffd700","#ff5cba","#48e5ff",
               "#ff7733","#ffffff","#b77bff"];

 for(let i=0;i<100;i++) {
   const angle=Math.random()*Math.PI*2;
   const speed=2+Math.random()*6;

   particles.push({
     x,y,
     vx:Math.cos(angle)*speed,
     vy:Math.sin(angle)*speed,
     life:65,
     color:colors[Math.floor(Math.random()*colors.length)],
     size:1+Math.random()*3
   });
 }
}

function animate() {
 ctx.clearRect(0,0,innerWidth,innerHeight);

 particles.forEach(p=>{
   ctx.globalAlpha=p.life/65;
   ctx.fillStyle=p.color;
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
   ctx.fill();

   p.x+=p.vx;
   p.y+=p.vy;
   p.vy+=0.045;
   p.life--;
 });

 ctx.globalAlpha=1;
 particles=particles.filter(p=>p.life>0);
 requestAnimationFrame(animate);
}
animate();

// Create original electronic cracker-like pop sounds
function popSound() {
 if(!audioContext) return;

 const now=audioContext.currentTime;

 // Short noise burst
 const length=Math.floor(audioContext.sampleRate*.12);
 const buffer=audioContext.createBuffer(
   1,length,audioContext.sampleRate
 );
 const data=buffer.getChannelData(0);

 for(let i=0;i<length;i++) {
   data[i]=(Math.random()*2-1)*Math.pow(1-i/length,3);
 }

 const noise=audioContext.createBufferSource();
 noise.buffer=buffer;

 const gain=audioContext.createGain();
 gain.gain.setValueAtTime(.65,now);
 gain.gain.exponentialRampToValueAtTime(.001,now+.12);

 noise.connect(gain);
 gain.connect(audioContext.destination);
 noise.start(now);

 // Low boom
 const osc=audioContext.createOscillator();
 const boom=audioContext.createGain();

 osc.type="sine";
 osc.frequency.setValueAtTime(110,now);
 osc.frequency.exponentialRampToValueAtTime(35,now+.16);

 boom.gain.setValueAtTime(.35,now);
 boom.gain.exponentialRampToValueAtTime(.001,now+.17);

 osc.connect(boom);
 boom.connect(audioContext.destination);
 osc.start(now);
 osc.stop(now+.18);
}

let started=false;

async function startSurprise() {
 if(started) return;
 started=true;

 document.getElementById("start").style.display="none";

 // Start audio after the visitor's tap
 const AudioCtx=window.AudioContext||window.webkitAudioContext;
 if(AudioCtx) {
   audioContext=new AudioCtx();
   await audioContext.resume();
 }

 // Show video
 const box=document.getElementById("videoBox");
 box.style.display="block";

 // Cluster of fireworks and pop sounds
 for(let i=0;i<18;i++) {
   setTimeout(()=>{
     const x=Math.random()*innerWidth;
     const y=100+Math.random()*innerHeight*.55;
     burst(x,y);
     popSound();
   },i*180);
 }

 // Start the visitor's own video
 const video=document.getElementById("myVideo");
 video.play().catch(()=>{
   video.controls=true;
   alert("Tap the video play button to start it.");
 });

 box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
</script>

</body>
</html>
